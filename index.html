<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speakerbot Pro</title>
    <link rel="apple-touch-icon" href="favicon.jpg">
    <style>
        :root { --primary: #ffffff; --bg-top: #7e5c78; --bg-bottom: #4a3852; --label-color: rgba(255,255,255,0.4); --input-bg: #f8f8f8; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%); margin: 0; padding: 15px; box-sizing: border-box; }
        .container { background: rgba(255,255,255,0.08); padding: 2rem; border-radius: 30px; width: 100%; max-width: 600px; box-sizing: border-box; backdrop-filter: blur(10px); }
        h1 { color: var(--primary); text-transform: uppercase; font-size: clamp(2rem, 10vw, 4rem); font-weight: 900; margin: 0 0 1.5rem 0; text-align: center; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        select, input { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h1>SPEAKERBOT</h1>
    <div class="controls">
        <select id="genderSelect">
            <option value="male" selected>MÄNNLICH (Premium/Siri)</option>
            <option value="female">WEIBLICH (Premium/Siri)</option>
        </select>
        <input type="text" id="textInput" placeholder="Schreib was..." enterkeyhint="send">
        <div id="status" style="color: yellow; font-size: 10px; margin-top: 10px; text-align: center; opacity: 0.6;"></div>
    </div>
</div>

<script>
    const input = document.getElementById('textInput');
    const genderSelect = document.getElementById('genderSelect');
    const status = document.getElementById('status');
    let synth = window.speechSynthesis;

    function getBestVoice(gender) {
        let voices = synth.getVoices().filter(v => v.lang.startsWith('de'));
        if (voices.length === 0) return null;

        // Suche gezielt nach männlichen Mustern
        const maleNames = ['Jonas', 'Stimme 4', 'Stimme 1', 'Yannick', 'Stefan'];
        const femaleNames = ['Katja', 'Stimme 3', 'Stimme 2', 'Anna'];

        const targets = (gender === 'male') ? maleNames : femaleNames;

        let selected = voices.sort((a, b) => {
            const score = (v) => {
                let s = 0;
                targets.forEach((t, i) => { if (v.name.includes(t)) s = Math.max(s, 100 - i); });
                if (v.name.includes('Premium') || v.name.includes('Neural')) s += 50;
                if (v.name === 'Anna') s -= 100; // Anna ist der Feind
                return s;
            };
            return score(b) - score(a);
        })[0];

        status.innerText = "Aktiv: " + selected.name;
        return selected;
    }

    // iOS Audio-Aktivierung
    function start() {
        const u = new SpeechSynthesisUtterance('');
        synth.speak(u);
        status.innerText = "Engine bereit. Stimmen: " + synth.getVoices().filter(v => v.lang.startsWith('de')).length;
    }
    window.addEventListener('touchstart', start, {once: true});

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(input.value);
            const voice = getBestVoice(genderSelect.value);
            if (voice) utterance.voice = voice;
            utterance.rate = 0.9;
            synth.speak(utterance);
            input.value = '';
            input.blur();
        }
    });

    // Stimmen laden
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
    }
</script>
</body>
</html>
